<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060D"/>
      <stop offset="0.55" stop-color="#140B29"/>
      <stop offset="1" stop-color="#071829"/>
    </linearGradient>
    <linearGradient id="bAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <filter id="bGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="260" rx="18" fill="url(#bBg)"/>
  <!-- Speedlines accents on right -->
  <g opacity="0.22" stroke="#22D3EE" stroke-width="2">
    <line x1="640" y1="0" x2="960" y2="90"/>
    <line x1="690" y1="0" x2="960" y2="55"/>
    <line x1="620" y1="260" x2="960" y2="165"/>
    <line x1="700" y1="260" x2="960" y2="205"/>
  </g>
  <!-- Decorative vertical strip miniature on right -->
  <g transform="translate(760 24)">
    <rect x="0" y="0" width="146" height="62" rx="4" fill="#17132B" stroke="#22D3EE" stroke-width="2.5"/>
    <polygon points="0,72 146,64 146,136 0,144" fill="url(#bAccent)" opacity="0.92"/>
    <path d="M18 128 L130 78" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" filter="url(#bGlow)"/>
    <rect x="0" y="154" width="146" height="58" rx="4" fill="#17132B" stroke="#FF2E88" stroke-width="2.5"/>
    <ellipse cx="96" cy="30" rx="34" ry="15" fill="#FFFFFF" stroke="#090714" stroke-width="2.5"/>
    <rect x="16" y="168" width="114" height="28" rx="2" fill="#041029" stroke="#60A5FA" stroke-width="1.8"/>
    <line x1="30" y1="182" x2="116" y2="182" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Logo mark -->
  <g transform="translate(52 66)">
    <rect x="0" y="0" width="124" height="124" rx="22" fill="#0F172A" stroke="url(#bAccent)" stroke-width="4"/>
    <rect x="24" y="18" width="76" height="22" rx="3" fill="#1E293B" stroke="#22D3EE" stroke-width="2.5"/>
    <polygon points="24,48 100,42 100,76 24,82" fill="url(#bAccent)"/>
    <rect x="24" y="90" width="76" height="16" rx="3" fill="#1E293B" stroke="#FF2E88" stroke-width="2.5"/>
    <ellipse cx="62" cy="62" rx="21" ry="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  </g>
  <!-- Title & tagline -->
  <text x="206" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="60" letter-spacing="-1.5" fill="#F8FAFC">Toon<tspan fill="url(#bAccent)">Craft</tspan></text>
  <text x="208" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="20" fill="#CBD5E1">Code-as-Webtoon Engine &amp; AI Agent Skill</text>
  <text x="208" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#94A3B8">Prompt  →  Strict Zod Schema  →  Pure SVG + Font Metrics  →  800px Vertical Scroll</text>
  <rect x="2" y="2" width="956" height="256" rx="16" fill="none" stroke="url(#bAccent)" stroke-width="2" opacity="0.45"/>
</svg>
