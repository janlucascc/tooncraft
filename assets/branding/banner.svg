<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B10"/>
      <stop offset="1" stop-color="#101420"/>
    </linearGradient>
    <linearGradient id="bAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <radialGradient id="bAmbient" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#A855F7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base surface -->
  <rect width="960" height="220" rx="16" fill="url(#bBg)"/>
  <rect width="960" height="220" rx="16" fill="url(#bAmbient)"/>

  <!-- Centered minimalist lockup -->
  <g transform="translate(216 0)">
    <g transform="translate(0 60)">
      <rect x="0" y="0" width="100" height="100" rx="22" fill="#0F1420" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
      <rect x="22" y="18" width="56" height="16" rx="3" fill="#1E293B"/>
      <polygon points="22,41 78,37 78,61 22,65" fill="url(#bAccent)"/>
      <rect x="22" y="71" width="56" height="11" rx="3" fill="#1E293B"/>
      <ellipse cx="50" cy="51" rx="14" ry="7.5" fill="#FFFFFF"/>
    </g>

    <text x="128" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.5" fill="#F8FAFC">Toon<tspan fill="url(#bAccent)">Craft</tspan></text>
    <text x="130" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="19" fill="#CBD5E1">Code-as-Webtoon Engine &amp; AI Agent Skill</text>
    <text x="130" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="14" letter-spacing="0.2" fill="#64748B">Prompt  ·  Zod Schema  ·  Pure SVG  ·  800px Vertical Scroll</text>
  </g>

  <!-- Subtle hairline frame -->
  <rect x="1" y="1" width="958" height="218" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
</svg>
