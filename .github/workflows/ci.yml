name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Build bundle & declarations
        run: npm run build

      - name: Validate showcase examples (strict SVG)
        run: npm run validate:examples

      - name: Smoke-render showcase examples
        run: npm run render:examples
